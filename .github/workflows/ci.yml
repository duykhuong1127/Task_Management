name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/files-multiview-realtime

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript
        run: pnpm run lint

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Production build
        run: pnpm run build
