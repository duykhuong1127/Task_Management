<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-pp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#B71219"/>
    </linearGradient>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bg-pp)"/>
  
  <!-- Stylized ribbons & P curves -->
  <g transform="translate(46, 60) scale(1.2)">
    <!-- White Card Layer -->
    <rect x="10" y="10" width="330" height="330" rx="36" fill="#0A0A0A" stroke="#ED1C24" stroke-width="4"/>
    
    <!-- Central P & Task Motif -->
    <text x="50" y="180" fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-weight="900" font-size="120" letter-spacing="-2">PP</text>
    <circle cx="270" cy="115" r="30" fill="#ED1C24"/>
    <path d="M70 235 L120 280 L230 170" fill="none" stroke="#D4AF37" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
